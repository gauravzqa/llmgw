# llmgw tenants -- a worked example.
#
# Loaded with:
#
#     LLMGW_TENANTS_FILE=config/tenants.toml make run
#
# and parsed by `llmgw.server.config.TenantTable.from_toml`. Everything in
# here is validated at startup: a limit that would make a denial unactionable
# (a zero rate, a burst below one), a token assigned to two tenants, a key
# the schema does not know -- all of them are a process that refuses to start.
# Nothing in this file can fail on the request path.
#
# ----------------------------------------------------------------------------
# What a tenant is
# ----------------------------------------------------------------------------
#
# A tenant is the unit of ISOLATION. Every request is admitted against one
# tenant's token bucket and one tenant's concurrency permit, and neither is
# shared with any other tenant. The
# tenant is identified by `Authorization: Bearer <token>`, looked up in the
# tokens configured below. The token is a credential: the gateway compares it
# and drops it, reports the tenant ID (`X-Gw-Tenant`) and never the token, and
# refuses at startup to forward `authorization` upstream.
#
# ----------------------------------------------------------------------------
# Where the tokens live: `token_env`, not `tokens`
# ----------------------------------------------------------------------------
#
# A tenant's tokens come from one or both of:
#
#   token_env  = "LLMGW_TENANT_LAYRS_TOKEN"     the NAME of an environment
#   token_envs = ["NAME_A", "NAME_B"]           variable whose VALUE is the token
#   tokens     = ["tok-literal"]                a literal, in this file
#
# Use `token_env` for anything deployed. It keeps this file free of secrets --
# ids and limits only -- so it is committed and shipped in the image, and the
# token values travel the same road as the provider keys (`fly secrets set`,
# a Kubernetes Secret, an env file outside the repository). Resolution is at
# startup: a `token_env` that is unset or empty is a process that REFUSES TO
# START, naming the variable, never a tenant with fewer tokens than promised.
# `tokens` literals remain for local development, where the file is not
# committed anyway. Every tenant except `anonymous` must end up with at least
# one token from somewhere; a named tenant nobody can be is a config error.
#
# With `LLMGW_REQUIRE_TENANTS=1` (the production scaffold sets it) the
# process also refuses to start with no tenants file, or with a file whose
# only tenant is `anonymous`.
#
# ----------------------------------------------------------------------------
# What happens with NO tenants file
# ----------------------------------------------------------------------------
#
# Every request is the one tenant `anonymous`, under the limits in
# `LLMGW_TENANT_RATE_PER_SECOND` / `_BURST` / `_MAX_CONCURRENCY` (defaults:
# 100/s, 200, 256). A bearer token, if sent, is ignored -- there is nothing to
# check it against. That is the zero-config path, and it is LOUD about itself:
# a warning at startup and `"tenant_mode": "anonymous"` in every `/probe`.
# One bucket for everyone is FAILURE-MODES row 6 exactly, so a deployment with
# more than one caller wants this file.
#
# ----------------------------------------------------------------------------
# The two limits, and why both
# ----------------------------------------------------------------------------
#
#   rate_per_second   token-bucket refill. Sustained requests per second.
#   burst             bucket capacity. How far ahead of the sustained rate a
#                     tenant may run -- an agent loop firing ten calls in
#                     parallel is a burst, not a flood.
#   max_concurrency   in-flight permits. The one that protects memory and
#                     upstream sockets, because what fills them is arrivals
#                     TIMES duration and the duration is the model's choice.
#
# A rate denial is a 429 with an exact `Retry-After`; a concurrency denial is a
# 429 with none, because backing off does nothing until one of the tenant's
# own requests finishes. A concurrency denial charges no rate token (C6).


# The production shape. One service calling the gateway; its token is the
# value of $LLMGW_TENANT_LAYRS_TOKEN, set out of band. Rate and burst sized
# for an interactive product whose pages fire a few calls on load; the
# concurrency cap is the real limit and sits under the per-process
# `LLMGW_MAX_STREAMS` so this tenant alone cannot fill the process.
[tenants.layrs]
token_env = "LLMGW_TENANT_LAYRS_TOKEN"
rate_per_second = 50.0
burst = 100
max_concurrency = 96
# Phase E: credentials the gateway will mint for this tenant that may be
# alive at once (Realtime client secrets, AssemblyAI streaming tokens). Each
# reservation lasts the credential's TTL; the (N+1)th mint is a 429 whose
# Retry-After is the earliest expiry. Omit for no cap.
max_sessions = 8

# Phase E1: fields pinned over the client's `session` on a Realtime client
# secret mint. `model` is a catalog id; `expires_after_seconds_cap` bounds the
# credential's TTL (the drain grace bounds it too). Allowed keys: model, voice,
# tools, turn_detection, max_output_tokens, instructions,
# expires_after_seconds_cap.
[tenants.layrs.realtime]
model = "openai.gpt-realtime-mini"
voice = "cedar"
tools = []
max_output_tokens = 1024
expires_after_seconds_cap = 600

# A local-development tenant with literal tokens. Fine here because this is
# an EXAMPLE file; a real deployment's file has no `tokens` key at all.
[tenants.acme]
tokens = ["tok-acme-prod-7f3a", "tok-acme-staging-19c2"]
rate_per_second = 20.0
burst = 40
max_concurrency = 16

# A batch pipeline. Low rate, no meaningful burst, and a concurrency cap that
# is the real limit: ninety-second summaries at 2/s is 180 streams in flight
# with no cap, and 8 with this one.
[tenants.batch-summaries]
tokens = ["tok-batch-a91e"]
rate_per_second = 2.0
burst = 4
max_concurrency = 8

# Unauthenticated traffic. OPTIONAL -- delete this table and a request with no
# bearer token is a 401. Keeping it means guest access is a budget decided
# here, in the same table as everyone else, rather than "unlimited" or
# "impossible". A request with an UNKNOWN token is a 401 regardless: a
# rotated-out key must not fall through to guest access.
[tenants.anonymous]
rate_per_second = 1.0
burst = 5
max_concurrency = 2


# ----------------------------------------------------------------------------
# What this file deliberately cannot express
# ----------------------------------------------------------------------------
#
# * A per-tenant model allowlist or catalog. Routing is the policy file's
#   (`workloads.example.toml`) and a request names its workload; which
#   workloads a tenant may name is an authorisation question with no
#   mechanism yet.
#
# * A token-per-minute budget. `metrics.DENIAL_REASONS` reserves
#   `tpm_reservation` for the reserve-then-settle version that admits on
#   `prompt + max_tokens`; the bucket here meters REQUESTS.
#
# * Anything fleet-wide. Every number here is per gateway process. N
#   instances give a tenant N times its cap (FAILURE-MODES rows 6 and 7).
#
# * Token rotation without a restart. The table is read once at startup, like
#   the policy file was before reload landed; `Gateway.tenants` is the single
#   object a later `replace()` would swap.
